<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader Simulator</title>
<style>
  :root { --bg: #ecebe6; --fg: #222; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1d1f; --fg: #ddd; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; }
  #add { cursor: pointer; text-decoration: underline; }
  #status { margin: 8px; min-height: 1.2em; }
  canvas { display: block; max-width: 100vw; height: auto; outline: none; }
</style>
</head>
<body>
<div id="status">Loading...</div>
<label id="add">Add books <input type="file" id="books" multiple accept=".epub,.txt,.xtc,.xtch,.bmp" hidden></label>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<script>
// Threads need a cross-origin isolated page. Hosts without the headers (GitHub Pages) get them from
// coi-sw.js: register it once, then reload so it can add them.
if (!self.crossOriginIsolated && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register('coi-sw.js').then(reg => {
    if (sessionStorage.getItem('coiReloaded')) {
      document.getElementById('status').textContent = 'This browser cannot run the simulator (no cross-origin isolation).';
      return;
    }
    sessionStorage.setItem('coiReloaded', '1');
    navigator.serviceWorker.ready.then(() => location.reload());
  });
}
</script>
<script>
// The simulator's SD card lives in IndexedDB (/sd), so books and settings survive a reload.
var Module = {
  canvas: document.getElementById('canvas'),
  print: t => console.log(t),
  printErr: t => console.warn(t),
  setStatus: t => { document.getElementById('status').textContent = t; },
  preRun: [() => {
    const params = new URLSearchParams(location.search);
    ENV.CROSSPOINT_SIM_SD = '/sd';
    if (params.get('frame') !== '0') ENV.CROSSPOINT_SIM_FRAME = '/frame/x4-pro';
    const restart = sessionStorage.getItem('simRestartEnv');  // set by a sleep/wake or reboot
    sessionStorage.removeItem('simRestartEnv');
    if (restart !== null) {
      for (const line of restart.split('\n')) if (line.includes('=')) ENV[line.slice(0, line.indexOf('='))] = line.slice(line.indexOf('=') + 1);
    } else if (params.get('script')) ENV.CROSSPOINT_SIM_INPUT_SCRIPT = params.get('script');
    FS.mkdir('/sd');
    FS.mount(Module.IDBFS, {}, '/sd');
    Module.addRunDependency('sd');
    FS.syncfs(true, () => Module.removeRunDependency('sd'));
    FS.mkdir('/frame');
    for (const name of ['x4-pro.png', 'x4-pro.keys']) {
      Module.addRunDependency(name);
      fetch('frame/' + name).then(r => r.arrayBuffer()).then(b => {
        FS.writeFile('/frame/' + name, new Uint8Array(b));
        Module.removeRunDependency(name);
      });
    }
    setInterval(() => FS.syncfs(false, () => {}), 5000);  // save the SD card every 5 s
  }],
};
// Books chosen here are copied into the simulated SD card's books/ folder (they never leave this browser).
document.getElementById('books').addEventListener('change', async ev => {
  try { FS.mkdir('/sd/books'); } catch (e) {}
  for (const f of ev.target.files) FS.writeFile('/sd/books/' + f.name.replace(/[\/\\]/g, '_'), new Uint8Array(await f.arrayBuffer()));
  FS.syncfs(false, () => {});
  Module.setStatus(ev.target.files.length + ' book(s) added to books/');
});
</script>
<script>
if (self.crossOriginIsolated) {  // otherwise the page reloads once coi-sw.js is active
  sessionStorage.removeItem('coiReloaded');
  const s = document.createElement('script');
  s.src = 'sim.js';
  document.body.appendChild(s);
}
</script>
</body>
</html>
