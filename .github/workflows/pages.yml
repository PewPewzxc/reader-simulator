# Publishes the web simulator (web/site/) to GitHub Pages: https://pewpewzxc.github.io/reader-simulator/
# The big per-build files (sim.js, sim.wasm) are not in git: they are assets of the GitHub release named in
# web/site/builds.json ("release"). This job downloads exactly the listed assets, checks each SHA-256
# against builds.json, puts them in builds/<id>/ and deploys. Needs Settings > Pages > Source: GitHub Actions.
name: Web simulator (Pages)

on:
  push:
    branches: [main]
    paths: ["web/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the builds listed in builds.json and check their SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp -r web/site _site
          tag="$(jq -r .release web/site/builds.json)"
          mkdir -p assets
          jq -r '.builds[] | .id as $id | .files[] | [$id, .name, .asset, .sha256] | @tsv' web/site/builds.json |
          while IFS=$'\t' read -r id name asset sum; do
            case "$id/$name/$asset" in *..*|/*) echo "bad entry: $id $name $asset"; exit 1;; esac
            gh release download "$tag" --repo "$REPO" --pattern "$asset" --dir assets --clobber
            echo "$sum  assets/$asset" | sha256sum --check --strict -
            mkdir -p "_site/builds/$id"
            cp "assets/$asset" "_site/builds/$id/$name"
          done
          du -sh _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
